<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warehouse Inventory</title>
  <link rel="stylesheet" href="/inventory.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo-mark">W</span>
        <span class="logo-text">Warehouse</span>
      </div>

      <a class="btn btn-primary sidebar-new-btn" href="/inventory/products/new" data-link>+ New Product</a>

      <nav class="sidebar-nav" id="sidebar-nav">
        <a class="nav-link" href="/inventory/products" data-link data-status="">All Products</a>
        <a class="nav-link" href="/inventory/products?status=draft" data-link data-status="draft">Draft</a>
        <a class="nav-link" href="/inventory/products?status=ready" data-link data-status="ready">Ready</a>
        <a class="nav-link" href="/inventory/products?status=listed" data-link data-status="listed">Listed</a>
        <a class="nav-link" href="/inventory/products?status=sold" data-link data-status="sold">Sold</a>
        <a class="nav-link" href="/inventory/products?status=archived" data-link data-status="archived">Archived</a>
      </nav>

      <button class="btn btn-ghost sidebar-sync-btn" id="sync-sold-btn">Sync sold status</button>
      <p class="sync-note" id="sync-note"></p>
    </aside>

    <div class="mobile-topbar">
      <button class="icon-btn" id="mobile-menu-btn" aria-label="Menu">&#9776;</button>
      <span class="mobile-title">Warehouse Inventory</span>
    </div>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <main class="main-content" id="main-content"></main>
  </div>

  <script src="/inventory.js"></script>
</body>
</html>
